<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background: Warm Ivory -->
  <rect width="1200" height="630" fill="#FAF6F0" />

  <!-- Subtle Border / Frame: Arena -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#E8DED2" stroke-width="2" />
  <rect x="36" y="36" width="1128" height="558" rx="14" stroke="#F1E9DE" stroke-width="1" />

  <!-- Decorative Corner Accents -->
  <circle cx="56" cy="56" r="3" fill="#A34835" />
  <circle cx="1144" cy="56" r="3" fill="#A34835" />
  <circle cx="56" cy="574" r="3" fill="#A34835" />
  <circle cx="1144" cy="574" r="3" fill="#A34835" />

  <!-- Logomark (Centered, Scaled) -->
  <g transform="translate(540, 110) scale(2.0)">
    <!-- Upper-Left Maker Frame (Espresso) -->
    <path fill="#302621" d="
      M 18.0 26.0
      A 8.0 8.0 0 0 1 26.0 18.0
      H 57.0
      A 5.0 5.0 0 0 1 62.0 23.0
      V 25.0
      A 5.0 5.0 0 0 1 57.0 30.0
      H 33.0
      A 3.0 3.0 0 0 0 30.0 33.0
      V 57.0
      A 5.0 5.0 0 0 1 25.0 62.0
      H 23.0
      A 5.0 5.0 0 0 1 18.0 57.0
      Z
    " />

    <!-- Lower-Right Recipient Frame (Deep Terracotta) -->
    <path fill="#A34835" d="
      M 78.0 70.0
      A 8.0 8.0 0 0 1 70.0 78.0
      H 39.0
      A 5.0 5.0 0 0 1 34.0 73.0
      V 71.0
      A 5.0 5.0 0 0 1 39.0 66.0
      H 63.0
      A 3.0 3.0 0 0 0 66.0 63.0
      V 39.0
      A 5.0 5.0 0 0 1 71.0 34.0
      H 73.0
      A 5.0 5.0 0 0 1 78.0 39.0
      Z
    " />

    <!-- Central Spark (Deep Terracotta) -->
    <path fill="#A34835" d="
      M 46.6 38.6
      A 2.0 2.0 0 0 1 49.4 38.6
      L 57.4 46.6
      A 2.0 2.0 0 0 1 57.4 49.4
      L 49.4 57.4
      A 2.0 2.0 0 0 1 46.6 57.4
      L 38.6 49.4
      A 2.0 2.0 0 0 1 38.6 46.6
      Z
    " />
  </g>

  <!-- Brand Title: Space For You -->
  <text x="600" y="360" text-anchor="middle" font-family="'Lora', Georgia, 'Times New Roman', serif" font-size="52" font-weight="500" fill="#302621" letter-spacing="-0.5">
    Space For You
  </text>

  <!-- Motto / Tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#57463E" letter-spacing="0.2">
