<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background: Warm Ivory -->
  <rect width="1200" height="630" fill="#FAF6F0" />

  <!-- Subtle Ambient Glows -->
  <circle cx="220" cy="140" r="240" fill="#EACABC" fill-opacity="0.28" />
  <circle cx="980" cy="490" r="260" fill="#A34835" fill-opacity="0.08" />

  <!-- Subtle Border / Frame: Arena -->
  <rect x="28" y="28" width="1144" height="574" rx="24" stroke="#E8DED2" stroke-width="2" />
  <rect x="42" y="42" width="1116" height="546" rx="18" stroke="#F1E9DE" stroke-width="1.5" />

  <!-- Decorative Corner Accents -->
  <circle cx="64" cy="64" r="4" fill="#A34835" />
  <circle cx="1136" cy="64" r="4" fill="#A34835" />
  <circle cx="64" cy="566" r="4" fill="#A34835" />
  <circle cx="1136" cy="566" r="4" fill="#A34835" />

  <!-- Logomark (Centered, Scaled) -->
  <g transform="translate(504, 88) scale(2.0)">
    <!-- Upper-Left Maker Frame (Espresso) -->
    <path fill="#302621" d="
      M 18.0 26.0
      A 8.0 8.0 0 0 1 26.0 18.0
      H 57.0
      A 5.0 5.0 0 0 1 62.0 23.0
      V 25.0
      A 5.0 5.0 0 0 1 57.0 30.0
      H 33.0
      A 3.0 3.0 0 0 0 30.0 33.0
      V 57.0
      A 5.0 5.0 0 0 1 25.0 62.0
      H 23.0
      A 5.0 5.0 0 0 1 18.0 57.0
      Z
    " />

    <!-- Lower-Right Recipient Frame (Deep Terracotta) -->
    <path fill="#A34835" d="
      M 78.0 70.0
      A 8.0 8.0 0 0 1 70.0 78.0
      H 39.0
      A 5.0 5.0 0 0 1 34.0 73.0
      V 71.0
      A 5.0 5.0 0 0 1 39.0 66.0
      H 63.0
      A 3.0 3.0 0 0 0 66.0 63.0
      V 39.0
      A 5.0 5.0 0 0 1 71.0 34.0
      H 73.0
      A 5.0 5.0 0 0 1 78.0 39.0
      Z
    " />

    <!-- Central Spark (Deep Terracotta) -->
    <path fill="#A34835" d="
      M 46.6 38.6
      A 2.0 2.0 0 0 1 49.4 38.6
      L 57.4 46.6
      A 2.0 2.0 0 0 1 57.4 49.4
      L 49.4 57.4
      A 2.0 2.0 0 0 1 46.6 57.4
      L 38.6 49.4
      A 2.0 2.0 0 0 1 38.6 46.6
      Z
    " />
  </g>

  <!-- Brand Title: Space for You -->
  <text x="600" y="345" text-anchor="middle" font-family="'Lora', Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#302621" letter-spacing="-0.8">
    Space for You
  </text>

  <!-- Tagline -->
  <text x="600" y="405" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="400" fill="#57463E">
    Interactive digital spaces with polaroid canvases, voice notes &amp; sealed letters.
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(235, 442)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="#F3ECE2" stroke="#E4D7C7" stroke-width="1" />
    <text x="110" y="25" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#302621">
      Interactive Canvas
    </text>

    <rect x="245" y="0" width="220" height="40" rx="20" fill="#F3ECE2" stroke="#E4D7C7" stroke-width="1" />
    <text x="355" y="25" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#302621">
      Voice Recordings
    </text>

    <rect x="490" y="0" width="240" height="40" rx="20" fill="#F3ECE2" stroke="#E4D7C7" stroke-width="1" />
    <text x="610" y="25" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#302621">
      Wax-Sealed Letters &amp; QR
    </text>
  </g>

  <!-- Domain & Author Signature -->
  <text x="600" y="542" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" fill="#8C766B" letter-spacing="0.4">
    spaceforyou.nikelyh.tech  •  Crafted by Yohan Nikel Villar Presentación (@yohanvillarp)
  </text>
</svg>
