name: Bug Report
description: File a report to help us identify and fix a defect.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please provide detailed reproduction steps so we can resolve it promptly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A concise description of the observed defect.
      placeholder: Describe the defect...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A description of what should have occurred.
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, viewport dimensions.
      placeholder: e.g., Windows 11, Chrome 124, 1920x1080
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Relevant logs, console errors, or screenshots.
    validations:
      required: false
